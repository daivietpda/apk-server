name: Build manifest and publish APK server

on:
  push:
    branches: [main]
    paths:
      - "apk/**"
      - "manifest-policy.json"
      - "uninstall-policy.json"
      - "scripts/**"
      - "tools/**"
      - ".github/workflows/publish.yml"
  workflow_dispatch:
    inputs:
      apk_file:
        description: "APK filename to configure; leave empty to only rebuild"
        required: false
        type: string
      package_name:
        description: "Android packageName required when force_install=true"
        required: false
        type: string
      force_install:
        description: "Force reinstall policy"
        required: true
        default: unchanged
        type: choice
        options: [unchanged, "true", "false"]
      uninstall_package:
        description: "Package name to uninstall, e.g. com.example.oldapp"
        required: false
        type: string
      uninstall_action:
        description: "Remote uninstall policy"
        required: true
        default: unchanged
        type: choice
        options: [unchanged, once, enforce, remove]
      uninstall_keep_data:
        description: "Keep app data when uninstalling"
        required: true
        default: false
        type: boolean
      uninstall_user_id:
        description: "Android user ID"
        required: true
        default: "0"
        type: string

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      should_deploy: ${{ steps.pages.outputs.should_deploy }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Locate aapt2
        shell: bash
        run: |
          AAPT2=$(find "$ANDROID_HOME/build-tools" -name aapt2 -type f | sort -V | tail -n 1)
          if [[ -z "$AAPT2" ]]; then
            sdkmanager "build-tools;35.0.0"
            AAPT2="$ANDROID_HOME/build-tools/35.0.0/aapt2"
          fi
          echo "AAPT2=$AAPT2" >> "$GITHUB_ENV"

      - name: Apply force-install policy and generate manifest
        shell: bash
        env:
          APK_FILE: ${{ inputs.apk_file }}
          PACKAGE_NAME: ${{ inputs.package_name }}
          FORCE_INSTALL: ${{ inputs.force_install }}
          UNINSTALL_PACKAGE: ${{ inputs.uninstall_package }}
          UNINSTALL_ACTION: ${{ inputs.uninstall_action }}
          UNINSTALL_KEEP_DATA: ${{ inputs.uninstall_keep_data }}
          UNINSTALL_USER_ID: ${{ inputs.uninstall_user_id }}
        run: |
          # workflow_dispatch supplies defaults, but push events leave all
          # inputs empty. Normalize them before validating the optional pair.
          APK_FILE="${APK_FILE:-}"
          PACKAGE_NAME="${PACKAGE_NAME:-}"
          FORCE_INSTALL="${FORCE_INSTALL:-unchanged}"
          UNINSTALL_PACKAGE="${UNINSTALL_PACKAGE:-}"
          UNINSTALL_ACTION="${UNINSTALL_ACTION:-unchanged}"
          UNINSTALL_KEEP_DATA="${UNINSTALL_KEEP_DATA:-false}"
          UNINSTALL_USER_ID="${UNINSTALL_USER_ID:-0}"

          args=(--base-url "https://daivietpda.github.io/apk-server/apk" --aapt2 "$AAPT2")
          if [[ "$FORCE_INSTALL" != "unchanged" ]]; then
            if [[ -z "$APK_FILE" ]]; then
              echo "apk_file is required when force_install is true or false" >&2
              exit 2
            fi
            args+=(--set-apk "$APK_FILE" --package-name "$PACKAGE_NAME" --force-install "$FORCE_INSTALL")
          elif [[ -n "$APK_FILE" ]]; then
            echo "Rebuilding $APK_FILE without changing its forceInstall policy"
          fi
          if [[ "$UNINSTALL_ACTION" != "unchanged" ]]; then
            if [[ -z "$UNINSTALL_PACKAGE" ]]; then
              echo "uninstall_package is required when uninstall_action is not unchanged" >&2
              exit 2
            fi
            args+=(--uninstall-package "$UNINSTALL_PACKAGE" --uninstall-action "$UNINSTALL_ACTION" --uninstall-keep-data "$UNINSTALL_KEEP_DATA" --uninstall-user-id "$UNINSTALL_USER_ID")
          elif [[ -n "$UNINSTALL_PACKAGE" ]]; then
            echo "Ignoring uninstall_package because uninstall_action is unchanged"
          fi
          python scripts/update_manifest.py "${args[@]}"

      - name: Build RemoteFetch DEX jar
        shell: bash
        run: |
          mkdir -p build/classes public
          curl --fail --location --retry 3 \
            --output build/r8.jar \
            https://dl.google.com/dl/android/maven2/com/android/tools/r8/9.1.31/r8-9.1.31.jar
          javac --release 8 -d build/classes tools/RemoteFetch.java
          jar cf build/input.jar -C build/classes RemoteFetch.class
          java -cp build/r8.jar com.android.tools.r8.D8 \
            --min-api 29 --output public/remote-preinstall.jar build/input.jar

      - name: Prepare GitHub Pages artifact
        shell: bash
        run: |
          mkdir -p public/apk
          cp manifest.json public/manifest.json
          find apk -maxdepth 1 -type f \( -iname '*.apk' -o -iname '*.zip' \) \
            -exec cp '{}' public/apk/ \;
          touch public/.nojekyll

      - name: Commit generated policy and manifest
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifest.json manifest-policy.json uninstall-policy.json
          if ! git diff --cached --quiet; then
            git commit -m "Update generated APK manifest"
            git push
          fi

      - id: pages
        name: Check Pages availability
        shell: bash
        run: echo "should_deploy=true" >> "$GITHUB_OUTPUT"

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    if: needs.build.outputs.should_deploy == 'true'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
